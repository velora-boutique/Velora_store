<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a64d79">
  <title>Velora | طلبيتك بكل أناقة</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7fa;
      color: #382632;
    }

    header {
      padding: 28px 18px;
      text-align: center;
      color: white;
      background: linear-gradient(135deg, #81365f, #c77da0);
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 34px;
      letter-spacing: 2px;
    }

    header p { margin: 0; line-height: 1.8; }

    main {
      max-width: 620px;
      margin: 24px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border: 1px solid #f0dce6;
      border-radius: 20px;
      padding: 22px 17px;
      box-shadow: 0 8px 25px #763c5710;
    }

    h2 {
      color: #963e6b;
      font-size: 21px;
      margin: 0 0 20px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input, textarea, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #e7cfdb;
      border-radius: 11px;
      background: #fffafd;
      font-size: 15px;
      font-family: inherit;
      color: #382632;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input:focus, textarea:focus, select:focus {
      outline: 2px solid #d9a1bb;
      border-color: #a64d79;
    }

    .hint {
      font-size: 12px;
      color: #806d79;
      line-height: 1.7;
      margin-top: 7px;
    }

    #preview {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    #preview img {
      width: 100%;
      height: 115px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #f0dce6;
    }

    .payment {
      background: #fff4f8;
      padding: 13px;
      border-radius: 12px;
      line-height: 1.8;
      font-size: 14px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 15px;
      margin-top: 22px;
      background: #963e6b;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border-radius: 10px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    footer {
      text-align: center;
      padding: 22px;
      color: #896e7d;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Velora</h1>
    <p>اختاري منتجك المفضّل، وأرسلي طلبك بكل سهولة ♡</p>
  </header>

  <main>
    <form id="orderForm" class="card">
      <h2>♡ تفاصيل المنتج</h2>

      <label for="productName">اسم المنتج *</label>
      <input id="productName" name="productName"
             placeholder="مثلاً: فستان، حقيبة، حذاء..." required>

      <label for="productLink">رابط المنتج</label>
      <input id="productLink" name="productLink" type="url"
             placeholder="الصقي رابط المنتج هنا إن وُجد">

      <label for="productDetails">تفاصيل المنتج *</label>
      <textarea id="productDetails" name="productDetails"
        placeholder="اللون، المقاس، الكمية، السعر إن كان معروفاً..."
        required></textarea>

      <label for="photos">إرفاق صور المنتج *</label>
      <input id="photos" name="photos" type="file"
             accept="image/*" multiple required>
      <div class="hint">
        اختاري صورة أو عدة صور من هاتفك. الصور تُرفع عند إرسال الطلب.
      </div>
      <div id="preview"></div>

      <hr style="border:0;border-top:1px solid #f0dce6;margin:24px 0">

      <h2>♡ معلومات الزبونة</h2>

      <label for="customerName">الاسم الكامل *</label>
      <input id="customerName" name="customerName"
             autocomplete="name" required>

      <label for="phone">رقم الهاتف *</label>
      <input id="phone" name="phone" type="tel"
             inputmode="tel" autocomplete="tel"
             placeholder="05 أو 06 أو 07..." required>

      <label for="wilaya">الولاية *</label>
      <input id="wilaya" name="wilaya"
             placeholder="اكتبي الولاية" required>

      <label for="municipality">البلدية *</label>
      <input id="municipality" name="municipality"
             placeholder="اكتبي البلدية" required>

      <label for="address">العنوان بالتفصيل</label>
      <textarea id="address" name="address"
                placeholder="الحي، الشارع، معلومات تساعد على التوصيل"></textarea>

      <label for="payment">طريقة الدفع *</label>
      <select id="payment" name="payment" required>
        <option value="BaridiMob">بريدي موب (BaridiMob)</option>
      </select>

      <div class="payment">
        💳 الدفع عبر بريدي موب. تفاصيل التحويل والتأكيد تُرسل للزبونة
        بعد الاتفاق على الطلب والسعر النهائي.
      </div>

      <button id="submitBtn" type="submit">إرسال الطلب</button>
      <div id="message" role="status" aria-live="polite"></div>
    </form>
  </main>

  <footer>Velora ♡ اختاري ما يشبه أناقتك</footer>

photoInput.addEventListener("change", () => {
  preview.replaceChildren();
  const files = Array.from(photoInput.files || []);
  const total = files.reduce((sum, file) => sum + file.size, 0);

  if (files.length > MAX_PHOTOS) {
    showMessage("اختاري 5 صور كحد أقصى.");
    photoInput.value = "";
    return;
  }

  if (files.some(file =>
    !["image/jpeg", "image/png", "image/webp"].includes(file.type)
  )) {
    showMessage("اختاري صور JPG أو PNG أو WEBP فقط.");
    photoInput.value = "";
    return;
  }

  if (total > MAX_TOTAL_SIZE) {
    showMessage("الحجم الإجمالي للصور لازم ما يفوتش 5 ميغابايت.");
    photoInput.value = "";
    return;
  }

  for (const file of files) {
    const img = document.createElement("img");
    img.alt = "معاينة صورة المنتج";
    img.src = URL.createObjectURL(file);
    preview.appendChild(img);
  }

  message.style.display = "none";
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const files = Array.from(photoInput.files || []);
  const total = files.reduce((sum, file) => sum + file.size, 0);

  if (!files.length) {
    showMessage("أرفقي صورة واحدة على الأقل للمنتج.");
    return;
  }

  if (files.length > MAX_PHOTOS || total > MAX_TOTAL_SIZE) {
    showMessage("اختاري حتى 5 صور، بحجم إجمالي لا يتجاوز 5 ميغابايت.");
    return;
  }

  if (FUNCTION_URL === "https://mnwskymgjvuwaijvdqza.supabase.co/functions/v1/rapid-function") {
    showMessage("لازم نضيفوا رابط الدالة قبل إرسال الطلب.");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "جارٍ إرسال الطلب...";
  message.style.display = "none";

  try {
    const data = new FormData();

    data.append("name",
      document.getElementById("customerName").value.trim());
    data.append("phone",
      document.getElementById("phone").value.trim());
    data.append("wilaya",
      document.getElementById("wilaya").value.trim());
    data.append("municipality",
      document.getElementById("municipality").value.trim());
    data.append("address",
      document.getElementById("address").value.trim());
    data.append("product",
      document.getElementById("productName").value.trim());
    data.append("details",
      [
        document.getElementById("productDetails").value.trim(),
        "رابط المنتج: " +
          (document.getElementById("productLink").value.trim() || "غير متوفر")
      ].join("\n"));
    data.append("payment",
      document.getElementById("payment").value);

    for (const file of files) {
      data.append("photos", file, file.name);
    }

    const response = await fetch(FUNCTION_URL, {
      method: "POST",
      body: data
    });

    const result = await response.json().catch(() => ({}));

    if (!response.ok || !result.success) {
      throw new Error(
        result.error || "تعذر إرسال الطلب. حاولي مرة أخرى."
      );
    }

    showMessage(
      "تم استلام طلبك بنجاح ❤️ رقم الطلب: " + result.orderId,
      true
    );

    form.reset();
    preview.replaceChildren();

  } catch (error) {
    console.error("Order submission error:", error);
    showMessage("❌ " + (error.message || "حدث خطأ أثناء الإرسال."));
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "إرسال الطلب";
  }
